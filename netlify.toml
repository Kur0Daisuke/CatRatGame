# "Powered by Netlify" is injected by Netlify (not in this repo).
# Turn it off for all visitors: Netlify UI → Project configuration → General → Powered by Netlify badge.

[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false
